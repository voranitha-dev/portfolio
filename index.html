    <!-- Apply the saved / system theme before first paint (prevents a light-mode flash). -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('portfolio-theme');
          var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>

    <!-- Page colours before the JS bundle (and Emotion) loads, so dark mode never flashes white.
         Keep in sync with palettes in src/styles/theme.ts. -->
    <style>
      html, body { margin: 0; background: #FAFAFA; color: #0A0A0A; }
      html[data-theme='dark'], html[data-theme='dark'] body { background: #0A0A0A; color: #FAFAFA; color-scheme: dark; }
    </style>
